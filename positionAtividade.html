<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        #TITULO{
            color: purple;
        }
        #container{
            position: relative;
            height : 500px;
            width : 500px;
            border : 10px solid purple;
        }
        #container>*{
            border : 1px solid black;
            width : 100px;
            height : 100px;
        }
        #box1{
            background-color: skyblue;  
            position: absolute;
            left : 0px;
        }
        #box2{
            background-color: skyblue;
            position: absolute;
            left : 400px;
        }
        #box3{
            background-color: yellow;
            position: absolute;
            bottom: 0px;
            position: 20px;
        }
        #box4{
            background-color: yellow;
            position: absolute;
            bottom: 0px;
            left : 400px;
        }
        #box5{
            background-color: gray;
            border-color: black;
            border-width: 2px;
            position: absolute;
            border-radius: 100%;
            bottom: 200px;
            left : 200px;
        }
    </style>
</head>
<body>
    <div>
        <h1 id="TITULO">positions</h1>
    </div>

    <div id="container">
        <div id="box1">box1</div>
        <div id="box2">box2</div>
        <div id="box3">box3</div>
        <div id="box4">box4</div>
        <div id="box5">box5</div>
    </div>
</body>
</html>
